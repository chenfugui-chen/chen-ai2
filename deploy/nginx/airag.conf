# 宿主机 Nginx 反向代理配置（IP + HTTP 访问，带 Basic Auth）
#
# 使用方式（Ubuntu）：
#   1. 安装：sudo apt install -y nginx apache2-utils
#   2. 生成账号密码（会提示输入密码）：sudo htpasswd -c /etc/nginx/.htpasswd 你的用户名
#   3. 把本文件复制为 /etc/nginx/sites-available/airag.conf
#   4. 启用：sudo ln -s /etc/nginx/sites-available/airag.conf /etc/nginx/sites-enabled/airag.conf
#      并删除默认站点：sudo rm -f /etc/nginx/sites-enabled/default
#   5. 检查并重载：sudo nginx -t && sudo systemctl reload nginx
#
# 说明：用 IP 访问时 server_name 填 _ 即可；将来有域名再改成你的域名并补 HTTPS。

server {
    listen 80;
    server_name _;

    # Basic Auth：浏览器访问会先弹框要求输入账号密码
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8501;

        # Streamlit 依赖 WebSocket，以下升级头必须带，否则页面白屏或反复重连
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接（长会话/流式输出）不要过早断开
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
